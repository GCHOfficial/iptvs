org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP 9 creates unit-test components only for the tested build type (debug) by
# default. AGP 9.5's Compose Preview task is created for every variant and
# fails the build for one without a unit-test component ("Unit tests are
# disabled for this variant (enableUnitTest = false in beforeVariants)"), so
# release variants need theirs back. Paired with
# testOptions.unitTests.isIncludeAndroidResources in app/build.gradle.kts.
android.onlyEnableUnitTestForTheTestedBuildType=false
