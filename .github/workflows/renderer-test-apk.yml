name: Renderer proof (TEMPORARY - Flutter 3.50.1 PR)

# TEMPORARY. Replaces renderer-test-apk.yml on the Flutter 3.50.1 branch only,
# for one dispatch, and is reverted in the next commit. It proves the RTD2875P
# Impeller opt-out still takes effect in a RELEASE-mode build after the hook
# moved to getFlutterEngineFlags(): debug-signed with the committed public
# debug key, no secrets, no environment, no DSN, nothing uploaded but logcat.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release-mode development APKs (debug-signed)
        env:
          IPTVS_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug.keystore
          IPTVS_ANDROID_KEYSTORE_PASSWORD: android
          IPTVS_ANDROID_KEY_ALIAS: androiddebugkey
          IPTVS_ANDROID_KEY_PASSWORD: android
        run: |
          set -e
          mkdir -p apk
          flutter build apk --release --flavor development --dart-define=DISTRIBUTION_CHANNEL=development
          cp build/app/outputs/flutter-apk/app-development-release.apk apk/unmodified.apk
          # The forced leg: drop only the BuildConfig.DEBUG gate on the force
          # extra, so a release build can take the same getFlutterEngineFlags()
          # path the denylist takes. Nothing else in the source changes.
          f=android/app/src/main/kotlin/com/gchofficial/iptvs/MainActivity.kt
          grep -q 'BuildConfig.DEBUG && intent?.getBooleanExtra(EXTRA_FORCE_SKIA_GL' "$f"
          sed -i 's/BuildConfig.DEBUG && intent?.getBooleanExtra(EXTRA_FORCE_SKIA_GL/intent?.getBooleanExtra(EXTRA_FORCE_SKIA_GL/' "$f"
          git diff --stat
          flutter build apk --release --flavor development --dart-define=DISTRIBUTION_CHANNEL=development
          cp build/app/outputs/flutter-apk/app-development-release.apk apk/forced.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-apks-NOT-FOR-DISTRIBUTION
          path: apk
          retention-days: 3

  prove:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: control
            apk: unmodified.apk
            extra: ''
          - mode: soc
            apk: unmodified.apk
            extra: '-prop ro.soc.model=RTD2875P'
          - mode: forced
            apk: forced.apk
            extra: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-apks-NOT-FOR-DISTRIBUTION
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none ${{ matrix.extra }}
          disable-animations: true
          script: bash tool/renderer_release_proof.sh apk/${{ matrix.apk }} ${{ matrix.mode }} "$RUNNER_TEMP/proof"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-${{ matrix.mode }}
          path: ${{ runner.temp }}/proof
          retention-days: 7
