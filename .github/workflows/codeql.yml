name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # CodeQL only covers native C++ / Kotlin / workflow YAML — skip it on PRs
    # that touch none of those (the Dart-only majority) so they don't spin up a
    # full Windows + Android build just to re-scan unchanged native code. It is
    # not a required status check, so skipping never blocks a merge; push-to-main
    # and the weekly cron still scan everything.
    paths:
      - 'windows/**'
      - 'android/**'
      - '.github/**'
  schedule:
    - cron: '23 5 * * 1' # weekly, Monday 05:23 UTC

# CodeQL doesn't support Dart (the bulk of lib/), so this covers the native code
# it can: the Windows-runner C++ (GDI overlay, HDR badges), the Android Kotlin
# (native HDR player / preview engine), and the workflow YAML.
#
# java-kotlin needs a CodeQL CLI that accepts the app's Kotlin (2.4.10).
# Support landed in CLI 2.26.2 / codeql-bundle-v2.26.2 — an older CLI aborts
# with "Kotlin version 2.4.10 is too recent" and fails the whole analysis.
#
# **The `codeql-action` refs below are pinned to a SHA, not to a floating tag,
# so the bundle version is fixed by that pin** — bumping Kotlin without also
# bumping these breaks CodeQL, and Dependabot will not connect the two. Check
# the bundle a candidate SHA actually ships before pinning it:
#   gh api repos/github/codeql-action/contents/src/defaults.json?ref=<sha> \
#     --jq '.content' | base64 -d
# The current pin ships codeql-bundle-v2.26.2. Kotlin 2.4.0 -> 2.4.10
# (deps#155) is exactly the upgrade that required moving off the 2.26.1 pin.
#
# Not covered:
#   - javascript-typescript: web/ is only Flutter's generated bootstrap (no source).
#   - swift: the iOS/macOS shells are Flutter template code (no first-party logic).
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.5

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
            runner: windows-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The Android build links the libdovi libmpv AAR, which lives in Git LFS
          # (android/app/libs/libmpv-dovi.aar); other languages don't need it.
          lfs: ${{ matrix.language == 'java-kotlin' }}

      - uses: github/codeql-action/init@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Both native builds are Flutter-driven, so CodeQL's autobuild can't build
      # them — run the real Flutter build under build-mode manual so the tracer
      # sees the compiler.
      - if: matrix.build-mode == 'manual'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Windows (C++)
        if: matrix.language == 'c-cpp'
        # Authenticates the GitHub API call in windows/CMakeLists.txt that
        # resolves the latest libmpv build (avoids the anonymous rate limit).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --debug

      - name: Build Android (Kotlin)
        if: matrix.language == 'java-kotlin'
        run: |
          flutter pub get
          flutter build apk --debug --flavor development --dart-define=DISTRIBUTION_CHANNEL=development

      - uses: github/codeql-action/analyze@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          category: "/language:${{ matrix.language }}"
