name: Sentry pipeline check

# Runs the real Sentry release steps (release registration, Flutter engine
# symbols, the R8 mapping upload) with the real token and reads back what
# landed, so "the symbol upload works" is a fact rather than an assumption. The
# mapping upload is the one that most needs it: it takes a different token
# scope from the debug-file upload, and at release time a failure is only a
# warning. On PRs that touch the Sentry scripts, and on demand. Same-repo PRs
# get secrets; forks skip.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to register (e.g. 0.1.76)'
        required: true
  pull_request:
    paths:
      - 'tool/sentry_*.sh'
      - '.github/workflows/sentry-check.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SENTRY_AUTH_TOKEN is a personal token, so it lives only in the
    # protected environments, not at repository level. This job borrows the
    # release one, which means every run waits for a reviewer's approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Check the Sentry pipeline
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          VERSION: ${{ inputs.version || '0.1.76' }}
          # The three libflutter.so debug ids for engine 89c39ed (arm, arm64, x86_64).
          KNOWN_DEBUG_IDS: 2ebcaefc-4ae7-2efb-5f4d-45e128a56c27 1b940a5c-2bda-bf55-b68e-94a27d703b0b e9ab9ffe-badf-e3bf-0526-03d3b85472e5
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH."; exit 1
          fi
          ./tool/sentry_pipeline_check.sh "$VERSION"
