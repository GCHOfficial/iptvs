name: Google Play Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (for example 1.2.3)'
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  build:
    name: Build signed Google Play AAB
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      # Validated before anything else runs, and read through env below rather
      # than interpolated, because this job holds the upload signing secrets.
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH (digits only)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true # libdovi libmpv AAR (android/app/libs/libmpv-dovi.aar)
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Prepare protected Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          missing=0
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_KEYSTORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD PLAY_UPLOAD_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the protected google-play environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptvs-play-upload.p12"
          chmod 600 "$RUNNER_TEMP/iptvs-play-upload.p12"
      # The identity this build's R8 mapping will be uploaded under. Generated
      # before the build because the manifest needs it and the mapping file
      # does not exist yet; `android/app/build.gradle.kts` writes it into the
      # manifest as `io.sentry.proguard-uuid`. Exported through `$GITHUB_ENV`
      # so the build and the upload below can't disagree. Not a secret: it
      # ships inside the bundle.
      - name: Generate the R8 mapping UUID
        run: |
          uuid=$(uuidgen 2>/dev/null || python3 -c 'import uuid; print(uuid.uuid4())')
          uuid=$(printf '%s' "$uuid" | tr 'A-F' 'a-f')
          if [ -z "$uuid" ]; then
            echo "::warning::Could not generate an R8 mapping UUID; this build's Kotlin/Java frames stay obfuscated."
            exit 0
          fi
          echo "IPTVS_SENTRY_PROGUARD_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Build signed App Bundle
        env:
          IPTVS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/iptvs-play-upload.p12
          IPTVS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          IPTVS_ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          IPTVS_ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          BUILD_NAME: ${{ inputs.version }}
        run: flutter build appbundle --release --flavor googlePlay --build-name "$BUILD_NAME" --build-number ${{ github.run_number }} --dart-define=DISTRIBUTION_CHANNEL=googlePlay --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }}
      - name: Verify bundle identity and upload signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: ./tool/verify_google_play_bundle.sh build/app/outputs/bundle/googlePlayRelease/app-googlePlay-release.aab build/app/intermediates/merged_manifests/googlePlayRelease/processGooglePlayReleaseManifest/AndroidManifest.xml
      - name: Name artifact
        env:
          BUILD_NAME: ${{ inputs.version }}
        run: cp build/app/outputs/bundle/googlePlayRelease/app-googlePlay-release.aab "iptvs-player-$BUILD_NAME-google-play.aab"
      # Crash reporting: tell Sentry this version exists. Always exits 0 and
      # is `continue-on-error` besides — a Sentry outage must never stop a
      # store submission. See docs/updates.md "Crash reporting (Sentry)".
      - name: Register the Sentry release
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          VERSION: ${{ inputs.version }}
        run: ./tool/sentry_register_release.sh "$VERSION"
      - name: Upload Flutter engine symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: ./tool/sentry_upload_engine_symbols.sh
      # Play gets a mapping from the AAB itself, so this is purely for Sentry:
      # without it every Kotlin/Java frame here arrives renamed. The bundle is
      # the `googlePlayRelease` variant.
      - name: Upload the R8 mapping to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: ./tool/sentry_upload_proguard_mapping.sh build/app/outputs/mapping/googlePlayRelease/mapping.txt "$IPTVS_SENTRY_PROGUARD_UUID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: google-play-${{ inputs.version }}
          path: iptvs-player-${{ inputs.version }}-google-play.aab
          if-no-files-found: error
          retention-days: 14
