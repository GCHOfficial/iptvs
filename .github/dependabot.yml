version: 2
updates:
  # Flutter / Dart packages (pubspec.yaml). Minor/patch bumps land in one grouped
  # PR to cut noise; majors stay individual (they can carry breaking changes).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pub-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The web panel (panel/package.json): supabase-js and Vite. Small surface, but
  # it is the only part of this project that ships as code a browser downloads,
  # so a dependency advisory here lands in front of every panel user at once —
  # unlike the app, which they update on their own schedule. Grouped like pub:
  # minor/patch together, majors on their own.
  - package-ecosystem: "npm"
    directory: "/panel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(panel)"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the build/release workflows — all bumps in one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Android Gradle dependencies (media3, etc.). The vendored libmpv AAR is a local
  # file and isn't tracked by Dependabot.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"
    groups:
      gradle-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # AGP is deliberately no longer ignored. It was, on the belief that AGP 9.3
    # broke release lint; the real cause was running 9.3's lint on JDK 17 (see
    # android/settings.gradle.kts), and every workflow now runs JDK 21. One
    # caveat still applies to an AGP bump: `lintVitalAnalyze*` runs on release
    # variants only, so the PR's debug smoke APK does not exercise it — build a
    # release APK before merging one.
