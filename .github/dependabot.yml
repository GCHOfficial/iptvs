version: 2
updates:
  # Flutter / Dart packages (pubspec.yaml). Minor/patch bumps land in one grouped
  # PR to cut noise; majors stay individual (they can carry breaking changes).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pub-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the build/release workflows — all bumps in one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Android Gradle dependencies (media3, etc.). The vendored libmpv AAR is a local
  # file and isn't tracked by Dependabot.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"
    groups:
      gradle-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # AGP is pinned to 9.2.1 in android/settings.gradle.kts — 9.3 crashes
      # **release** lint on url_launcher_android (NoSuchMethodError out of
      # CommentDetector, JDK 17). A grouped minor bump already carried it to
      # 9.3.1 once and broke the v0.1.44 release build; nothing caught it in
      # review or CI because `lintVitalAnalyze*` runs on release variants only,
      # so the smoke APK and every local `--debug` build skip it. Ignoring the
      # artifact keeps that decision from being undone silently. Remove this
      # together with the pin once the upstream regression is fixed.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
