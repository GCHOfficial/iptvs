version: 2
updates:
  # Flutter / Dart packages (pubspec.yaml). Minor/patch bumps land in one grouped
  # PR to cut noise; majors stay individual (they can carry breaking changes).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pub-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the build/release workflows — all bumps in one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Android Gradle dependencies (media3, etc.). The vendored libmpv AAR is a local
  # file and isn't tracked by Dependabot.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"
    groups:
      gradle-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # androidx.core 1.19.0+ requires consumers to compile against API 37, but
      # `compileSdk` is `flutter.compileSdkVersion` (36 on Flutter 3.44.5), so a
      # bump here fails `checkAarMetadata` and can only be taken by hard-coding
      # compileSdk and diverging from the SDK level Flutter tests against. That
      # is a deliberate change, not a grouped minor bump — see the comment on the
      # dependency in android/app/build.gradle.kts. Drop this ignore when
      # Flutter's own compileSdkVersion reaches 37.
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
